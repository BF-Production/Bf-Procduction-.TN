<section id="contact" class="section contact">
  <div class="container">
    <div class="contact-card">
      <div class="contact-info">
        <div>
          <span class="section-tag">Start The Flame</span>
          <h2>READY TO FEEL THE LIFE?</h2>
          <p>Tell us your vision. We handle the staging, the cameras, the lasers, and the sound to blow away your audience.</p>
        </div>

        <ul class="info-list">
          <li><i class="fa-solid fa-location-dot"></i> Béni Khiar, Nabeul 8060, Tunisia</li>
          <li><i class="fa-brands fa-instagram"></i> @bf.production.tn</li>
          <li><i class="fa-brands fa-facebook"></i> BF Production .TN</li>
        </ul>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Your Name / Organization</label>
          <input type="text" id="name" placeholder="E.g., Karim Ben Salem" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp</label>
          <input type="tel" id="phone" placeholder="+216 00 000 000" required>
        </div>
        <div class="form-group">
          <label for="serviceType">Production Type</label>
          <select id="serviceType">
            <option value="Concert / Festival Tour">Concert / Festival Tour</option>
            <option value="Film & Video Shooting">Film & Video Shooting</option>
            <option value="Luxury Wedding / Private Event">Luxury Wedding / Private Event</option>
            <option value="Corporate Summit / Conference">Corporate Summit / Conference</option>
            <option value="Sound & Light Rental">Sound & Light Rental</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Your Vision</label>
          <textarea id="message" rows="4" placeholder="Tell us about the dates, venue, scale, and the vibe you want..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Send Directly on WhatsApp <i class="fa-brands fa-whatsapp"></i></button>
      </form>
    </div>
  </div>
</section>
