<section id="contact" class="section contact">
  <div class="container">
    <div class="contact-card">
      <div class="contact-info">
        <div>
          <span class="section-tag"><i class="fa-solid fa-bolt"></i> Démarrons votre projet</span>
          <h2>PRÊTS À FAIRE VIBRER VOTRE ÉVÉNEMENT ?</h2>
          <p>Partagez-nous votre vision. Nous orchestrons la scène, l'éclairage, la régie vidéo et la puissance acoustique pour marquer votre public.</p>
        </div>

        <ul class="info-list">
          <li><i class="fa-solid fa-location-dot"></i> Béni Khiar, Nabeul 8060, Tunisie</li>
          <li><i class="fa-brands fa-instagram"></i> @bf.production.tn</li>
          <li><i class="fa-brands fa-facebook"></i> BF Production .TN</li>
        </ul>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Nom / Entreprise ou Organisateur</label>
          <input type="text" id="name" placeholder="Ex. Karim Ben Salem" required>
        </div>
        <div class="form-group">
          <label for="phone">Téléphone / WhatsApp</label>
          <input type="tel" id="phone" placeholder="+216 -- --- ---" required>
        </div>
        <div class="form-group">
          <label for="serviceType">Type de Prestation</label>
          <select id="serviceType">
            <option value="Concert & Festival Live">Concert &amp; Festival Live</option>
            <option value="Tournage Cinéma & Clip Vidéo">Tournage Cinéma &amp; Clip Vidéo</option>
            <option value="Événement Privé & Mariage Prestige">Événement Privé &amp; Mariage Prestige</option>
            <option value="Conférence & Sommet Institutionnel">Conférence &amp; Sommet Institutionnel</option>
            <option value="Location Matériel Son, Lumière & LED">Location Matériel Son, Lumière &amp; LED</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Détails du Projet</label>
          <textarea id="message" rows="4" placeholder="Date prévue, lieu, envergure et besoins techniques spécifiques..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          Envoyer directement via WhatsApp <i class="fa-brands fa-whatsapp"></i>
        </button>
      </form>
    </div>
  </div>
</section>
